# 로컬/랜 데모: Apache Kafka (KRaft) + MySQL + API
# infra/.env 에 KAFKA_ADVERTISED_HOST= (이 PC의 LAN IP, Pi가 접근 가능)
#  cp docker-compose.local.env.example .env
# API ↔ Kafka: kafka:19092
# Pi/edge: <KAFKA_ADVERTISED_HOST>:9094
#
# Bitnami 볼륨 쓰던 경우 끊을 것: docker volume rm overtraining_kafka_local_data

services:
  mysql:
    image: mysql:8.0
    container_name: overtraining-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: devlocal
      MYSQL_DATABASE: overtraining
    command: >
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    container_name: overtraining-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST}:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka_local_data:/tmp/kraft-combined-logs

  prometheus:
    image: prom/prometheus:latest
    container_name: overtraining-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_local_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"

  api-server:
    build: ../apps/api-server
    container_name: overtraining-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=dev-local-jwt-secret-change-in-prod
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=devlocal
      - MYSQL_DB=overtraining
      - KAFKA_BROKERS=kafka:19092
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - FRONTEND_REDIRECT_URI=${FRONTEND_REDIRECT_URI:-http://localhost:3001/dashboard}
      - FITBIT_CLIENT_ID=local
      - FITBIT_CLIENT_SECRET=local
      - FITBIT_REDIRECT_URI=http://localhost:3000/auth/fitbit/callback
      - EDGE_API_KEY_PEPPER=dev-pepper-local
      - SEED_EDGE_API_KEY=pi-01-initial-key
    depends_on:
      - mysql
      - kafka

volumes:
  mysql_local_data:
  kafka_local_data:
  prom_local_data:
