# /etc/nginx/sites-enabled/ 등에 사본 후 server_name, ssl_certificate 경로,
#  그리고 Docker compose 가 올리는 127.0.0.1:3000 / 127.0.0.1:3001 에 맞게 쓰세요.
# .env API_BASE_URL, DASHBOARD_BASE_URL, NEXT_PUBLIC_API_BASE(빌드)는 이 **공개** URL 과 일치.
#
# 설정 반영: sudo nginx -t && sudo systemctl reload nginx

# upstream 은 map 없이 127.0.0.1:3000 으로 직접 proxy 해도 됨
upstream overtraining_api {
  server 127.0.0.1:3000;
  keepalive 8;
}
upstream overtraining_next {
  server 127.0.0.1:3001;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name overtraining.kro.kr;

  # (선택) certbot / ACME
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name overtraining.kro.kr;

  ssl_certificate     /etc/letsencrypt/live/overtraining.kro.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/overtraining.kro.kr/privkey.pem;
  # ssl_stapling on; ...

  # /metrics 는 Prometheus(호스트)를 보려면: proxy_pass 127.0.0.1:9090;
  #  지금 prom 컨테이너 /metrics. API(Express) /metrics 를 쓰려면 둘 중 하나만 443에 매칭.

  # ——— Express API: /auth, /api, /api-docs, /health ———
  location /auth/ {
    proxy_pass http://overtraining_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # /auth (슬래시 없음) Fitbit 콜백 등
  location /api/ {
    proxy_pass http://overtraining_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # SSE(세션 스트림)
  location ~ ^/api/sessions/[^/]+/stream$ {
    proxy_pass http://overtraining_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1d;
    add_header X-Accel-Buffering no;
  }

  location /api-docs {
    proxy_pass http://overtraining_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api-docs/ {
    proxy_pass http://overtraining_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://overtraining_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # (선택) public Prometheus /metrics
  # location = /metrics {
  #   proxy_pass http://127.0.0.1:9090/metrics;  # prom 컨테이너
  #   proxy_set_header Host $host;
  # }
  # API Exporter /metrics 를 443에 쓰려면 위를 빼고 별 path 사용

  # ——— Next.js (나머지 전부) ———
  location / {
    proxy_pass http://overtraining_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next: Upgrade (필요 시)
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";
  }
}
